[env:seeed_xiao_esp32s3]
platform = espressif32
board = seeed_xiao_esp32s3
framework = arduino

monitor_speed = 115200
upload_speed = 921600

board_build.partitions = huge_app.csv
board_build.arduino.memory_type = qio_opi

build_flags =
    -DBOARD_HAS_PSRAM
    -DCORE_DEBUG_LEVEL=1
    -Ilib/fedeSeed_inferencing_new/src/edge-impulse-sdk/porting/espressif/esp-dsp/modules/fft/include
    -IC:/Users/FEDE/.platformio/packages/framework-arduinoespressif32-esp32s3-libs/include/xtensa/esp32s3/include

lib_deps =
    marcoschwartz/LiquidCrystal_I2C@^1.1.4

monitor_filters =
    esp32_exception_decoder